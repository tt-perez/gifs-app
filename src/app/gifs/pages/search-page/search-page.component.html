<h2 class="text-2xl font-bold mt-5">Serch Gifs</h2>
<h3 class="text-sm text-gray-500">Serch gifs by name, description or tags</h3>

<section class="flex flex-col gap-4">
    <input type="text" 
    placeholder="search gifs"
    class="mt-3 border border-gray-300 rounded-md p-2"
    (keyup.enter)="onSearch(txtsearch.value)"
    #txtsearch>
    

    <section class="py-5">
    <gifs-list [gifs]="gifs()"/>

</section>


</section>
